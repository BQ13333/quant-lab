version: 2
name: asia_public_equity_quant_shop_multi_agent_blueprint
principle: "Agents coordinate research; deterministic Python, data manifests, validation gates, and human approval promote or reject."

source_coverage:
  latest_run_id: SOURCE-COVERAGE-BOOKS-20260707
  artifact_dir: artifacts/source_coverage/SOURCE-COVERAGE-BOOKS-20260707
  corpus_scope: external_books_only
  markdown_files: 69
  headings: 32471
  strategy_or_model_headings: 4884
  data_dependency_headings: 893
  source_strategy_specs: 15
  implemented_source_strategy_specs: 11
  blocked_source_strategy_specs: 4
  repo_inclusive_run_id: SOURCE-COVERAGE-08Q-20260707
  rule: "No strategy implementation without source provenance or explicit original-research note."

coordination:
  orchestrator_target: langgraph
  local_first_rule: "Every agent cell must be callable as deterministic Python before LLM autonomy."
  handoff_required_fields:
    - run_id
    - agent_id
    - input_artifacts
    - output_artifacts
    - data_asof_utc
    - source_asof_utc
    - known_limitations
    - pass_fail
    - next_owner
  promotion_states:
    - idea
    - source_mapped
    - data_requirements_known
    - data_available
    - feature_built
    - backtested
    - audit_passed
    - risk_passed
    - paper_trading_ready
    - production_candidate

closed_loop_alpha_factory:
  active_universe:
    default_countries:
      - Malaysia
      - Singapore
      - Indonesia
    removed_countries:
      Philippines: "Not tradable for us."
      Vietnam: "Removed from active project universe."
    parked_countries:
      Thailand: "Outside current scope."
    latest_l2_artifact: artifacts/codex_backtests/CODEX_ASEAN_L2_DEEP_20260707/05_l2_deep_extraction/ASEAN-L2-DEEP-MYS-SGP-IDN-20260708
    u2_backtest_eligible: 169
    u3_liquid_proxy: 95
  prime_objective:
    owner: chief_quant_pm
    target: "Maximize robust out-of-sample net IR / Sharpe subject to anti-overfit, cost, capacity, and provenance gates."
    pm_promotion_min_net_sharpe: 3.0
    pm_promotion_min_deflated_sharpe_probability: 0.95
    rule: "Sharpe 3 is a PM promotion gate, not permission to overfit the research loop."
    optimize_for:
      - out_of_sample_net_sharpe
      - out_of_sample_net_information_ratio
      - deflated_sharpe
      - probabilistic_sharpe
      - low_pbo
      - final_holdout_survival
      - low_turnover
      - capacity_at_usd5m_and_above
      - incremental_alpha_after_correlation_penalty
      - source_originality_and_explainability
    never_optimize_for:
      - raw_in_sample_sharpe_alone
      - final_holdout_tuned_score
      - one_stock_or_one_month_edge
      - untraceable_ml_features
      - variants_excluding_killed_trials
  loop_topology:
    - chief_quant_pm_alpha_mission
    - markdown_source_extraction
    - formula_registry
    - data_qa_pit_availability
    - feature_factory
    - model_factory
    - backtest_engine_u2_u3
    - olympiad_math_disproof
    - portfolio_pm_mixture
    - risk_capacity_tca
    - research_memo_and_kill_report
    - pm_decision_gate
  sub_agents:
    markdown_source_extraction:
      - book_inventory_agent
      - formula_extractor_agent
      - strategy_taxonomist_agent
      - source_provenance_agent
      - copyright_safety_agent
    model_factory:
      - baseline_model_agent
      - ml_model_agent
      - deep_learning_agent
      - genetic_formula_agent
      - regime_router_agent
      - ensemble_agent
    olympiad_math:
      - proof_obligation_agent
      - cpcv_pbo_agent
      - deflated_sharpe_agent
      - reality_check_agent
      - bootstrap_agent
      - parameter_surface_agent
      - adversarial_validation_agent
    portfolio_pm:
      - alpha_book_pm
      - allocator_agent
      - risk_budget_agent
      - capacity_agent
      - kill_switch_agent
  loop_back_rules:
    data_failure: data_factory_or_blocked_by_data
    leakage_failure: feature_factory_and_validation
    weak_net_return: model_factory_mutation
    turnover_or_cost_failure: portfolio_construction_and_tca
    concentration_failure: allocator_and_universe_breadth_review
    multiple_testing_failure: kill_or_demote
    holdout_failure: kill_exact_variant
    correlated_candidate: ensemble_only_if_incremental
  candidate_ledger_required_columns:
    - candidate_id
    - parent_candidate_id
    - source_strategy_id
    - formula_family
    - feature_set_id
    - model_class
    - hyperparameter_hash
    - train_window
    - validation_window
    - holdout_window
    - trial_number
    - net_sharpe
    - net_ir
    - max_drawdown
    - turnover
    - cost_assumption_bps
    - pbo
    - deflated_sharpe
    - psr
    - capacity_usd
    - promotion_state
    - kill_reason
  research_grade_minimum_gate:
    require_u2_and_u3_backtests: true
    sealed_final_holdout: "2024-01-02 to 2026-07-06"
    require_pm_promotion_min_net_sharpe: 3.0
    require_pm_promotion_min_deflated_sharpe_probability: 0.95
    require_positive_net_sharpe_after_costs: true
    require_multiple_testing_adjustment: true
    require_non_spiky_parameter_surface: true
    require_capacity_and_drawdown_pass: true
    require_source_or_original_research_id: true

cells:
  research_director:
    agents:
      - chief_quant_pm
      - research_queue_manager
      - experiment_controller
      - promotion_committee_secretary
    owns:
      - strategy_backlog
      - experiment_priority
      - promotion_minutes
      - kill_or_promote_decisions
    artifacts:
      - artifacts/research_queue/strategy_backlog.csv
      - artifacts/research_queue/experiment_queue.csv
      - artifacts/research_queue/promotion_minutes.md
    done_criteria:
      - "Every experiment has owner, source, data requirement, expected artifact, and gate."

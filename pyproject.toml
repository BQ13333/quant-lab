[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-lab"
version = "0.1.0"
description = "Evidence-first quantitative research framework with bounded multi-agent review and point-in-time controls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamin Quek" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "cryptography>=43,<49",
  "exchange-calendars>=4.13,<5",
  "numpy>=1.23",
  "openpyxl>=3.1",
  "pandas>=1.4",
  "pdfplumber>=0.11",
  "pyarrow>=24.0.0",
  "pypdf>=5.0",
  "requests>=2.31",
  "tabulate>=0.9",
  "xlrd>=2.0.1",
  "yfinance>=1.5.1",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.3",
]
research = [
  "optuna>=4",
  "mlflow>=3",
]
stats = [
  "scipy>=1.9",
]
agents = [
  "langgraph>=1.2",
]
cerebras-rag = [
  "cerebras-cloud-sdk>=1.91,<2",
  "fastembed>=0.7,<1",
  "langchain-cerebras>=0.8,<1; python_version >= '3.11' and python_version < '3.13'",
  "langchain-core>=1.4,<2; python_version >= '3.11' and python_version < '3.13'",
]
refinitiv = [
  "lseg-data>=2.0",
]
calendar = [
  "pandas-market-calendars>=5.1,<6",
]
portfolio = [
  "cvxpy>=1.4",
  "PyPortfolioOpt>=1.5",
  "riskfolio-lib>=7",
  "scipy>=1.15.3",
  "skfolio>=0.9",
]
backtest = [
  "vectorbt>=0.27",
]
execution = [
  "ib-insync>=0.9.86",
]

[project.urls]
Homepage = "https://github.com/BQ13333/quant-lab"
Repository = "https://github.com/BQ13333/quant-lab"
Issues = "https://github.com/BQ13333/quant-lab/issues"

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
